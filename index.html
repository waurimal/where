<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Place - 1:1 Battle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
  
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: #f0f4f8;
    color: #333;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  
  .container {
    background: white;
    width: 100%;
    max-width: 800px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 30px;
    box-sizing: border-box;
    text-align: center;
  }

  h1 { color: #1e3a8a; margin-top: 0; }
  h2 { color: #2563eb; }

  /* UI 패널 전환용 */
  .panel { display: none; }
  .panel.active { display: block; }

  /* 에러 및 알림 메시지 박스 */
  #sys-msg {
    color: #dc2626; font-weight: bold; margin-bottom: 15px; min-height: 24px;
  }

  /* 입력 폼 */
  .input-group { margin: 20px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  input {
    padding: 12px;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    width: 90px;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: #2563eb; }
  #playerName { width: 140px; }

  .btn {
    background: #2563eb; color: white;
    border: none; padding: 14px 30px;
    font-size: 18px; font-weight: bold;
    border-radius: 8px; cursor: pointer;
    transition: 0.2s; box-shadow: 0 4px 6px rgba(37,99,235,0.2);
  }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }

  /* 스코어보드 & 게임 화면 */
  .scoreboard { display: flex; justify-content: space-between; margin-bottom: 20px; }
  .score-box { flex: 1; margin: 0 10px; padding: 15px; border-radius: 12px; border: 4px solid transparent; transition: 0.2s; }
  .score-box.p1 { background: #fee2e2; color: #991b1b; }
  .score-box.p2 { background: #e0e7ff; color: #3730a3; }
  .score-box.active { transform: scale(1.05); }
  .score-box.p1.active { border-color: #ef4444; }
  .score-box.p2.active { border-color: #4f46e5; }
  
  .score { font-size: 36px; font-weight: bold; }

  /* 모바일용 터치 버저 */
  .mobile-buzzers { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
  .buzzer-btn {
    flex: 1; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px;
    color: white; cursor: pointer;
  }
  .p1-buzzer { background: #ef4444; }
  .p2-buzzer { background: #4f46e5; }
  .buzzer-btn:active { transform: translateY(4px); }

  #game-msg {
    background: #fef3c7; color: #b45309;
    padding: 20px; border-radius: 12px;
    font-size: 22px; font-weight: bold; margin-bottom: 20px;
    min-height: 30px;
  }

  /* 지도 UI */
  .map-wrapper {
    background: #94a3b8; padding: 20px; border-radius: 16px;
    display: inline-block; margin-top: 10px;
  }
  .map-row { display: flex; gap: 40px; margin-bottom: 30px; }
  .building {
    width: 120px; height: 100px; background: #f8fafc;
    border: 4px solid #334155; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .building span { font-size: 30px; margin-bottom: 5px; }
  .building:hover { transform: translateY(-5px); border-color: #eab308; background: white; }
  
  .start-point {
    width: 120px; height: 40px; background: #facc15; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; margin: 0 auto;
  }

  /* 명예의 전당 테이블 */
  table { width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 30px; }
  th, td { border-bottom: 1px solid #cbd5e1; padding: 15px 10px; font-size: 18px; }
  th { background: #f1f5f9; color: #475569; font-weight: bold; }
  td { color: #1e293b; }
  
  /* 로딩 표시기 */
  .loading { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="container">
  
  <!-- 1. 로그인 패널 -->
  <div id="login-panel" class="panel active">
    <h1>🗺️ Find the Place</h1>
    <p style="color: #64748b; font-size: 18px;">학년, 반, 번호, 이름을 입력하고 스피드 대결을 시작하세요!</p>
    
    <div id="sys-msg"></div>

    <div class="input-group">
      <input type="number" id="inp-grade" placeholder="학년" min="1" max="6">
      <input type="number" id="inp-class" placeholder="반" min="1" max="20">
      <input type="number" id="inp-num" placeholder="번호" min="1" max="50">
      <input type="text" id="inp-name" placeholder="이름" maxlength="10">
    </div>
    
    <button id="btn-login" class="btn">게임 입장 준비</button>
  </div>


  <!-- 2. 게임 패널 -->
  <div id="game-panel" class="panel">
    <h2>1:1 스피드 퀴즈</h2>
    
    <div class="scoreboard">
      <div id="box-p1" class="score-box p1">
        <div>Player 1 (A키)</div>
        <div class="score" id="score-p1">0</div>
      </div>
      <div id="box-p2" class="score-box p2">
        <div>Player 2 (L키)</div>
        <div class="score" id="score-p2">0</div>
      </div>
    </div>

    <!-- 모바일 환경을 위한 터치 버저 -->
    <div class="mobile-buzzers">
      <button class="buzzer-btn p1-buzzer" onclick="triggerBuzzer(1)">P1 터치 버저</button>
      <button class="buzzer-btn p2-buzzer" onclick="triggerBuzzer(2)">P2 터치 버저</button>
    </div>

    <div id="game-msg">문제를 준비하는 중입니다...</div>

    <div class="map-wrapper">
      <div class="map-row">
        <div class="building" data-answer="School"><span>🏫</span>School</div>
        <div class="building" data-answer="Hospital"><span>🏥</span>Hospital</div>
      </div>
      <div class="map-row">
        <div class="building" data-answer="Library"><span>📚</span>Library</div>
        <div class="building" data-answer="Police Station"><span>👮</span>Police Station</div>
      </div>
      <div class="map-row">
        <div class="building" data-answer="Park"><span>🌳</span>Park</div>
        <div class="building" data-answer="Bank"><span>🏦</span>Bank</div>
      </div>
      <div class="start-point">🚶‍♂️ Start</div>
    </div>
  </div>


  <!-- 3. 결과 & 명예의 전당 패널 -->
  <div id="result-panel" class="panel">
    <h1 style="color: #ea580c;">🏆 명예의 전당 (Top 10)</h1>
    <p id="result-sys-msg" style="color: #64748b; font-size: 18px;"></p>
    
    <table>
      <thead>
        <tr>
          <th>순위</th>
          <th>소속</th>
          <th>이름</th>
          <th>최고 점수</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4">데이터를 불러오는 중입니다 <span class="loading">⏳</span></td></tr>
      </tbody>
    </table>

    <button class="btn" onclick="location.reload()">새 게임 시작</button>
  </div>

</div>

<!-- Firebase 및 게임 로직 스크립트 -->
<script type="module">
  // 1. Firebase 라이브러리 로드 (v11.6.1)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  // 2. 제공해주신 Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyCAR_dSA_jViVY0RZAI3s41a39u9NufFj8",
    authDomain: "where-2599e.firebaseapp.com",
    projectId: "where-2599e",
    storageBucket: "where-2599e.firebasestorage.app",
    messagingSenderId: "1090101095033",
    appId: "1:1090101095033:web:b80a7311d8dff569b842a8",
    measurementId: "G-9F6CZ0M5HG"
  };

  // Firebase 초기화
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  const appId = typeof __app_id !== 'undefined' ? __app_id : 'find-the-place-game';
  
  // 시스템 메시지 출력 헬퍼 함수
  function showSysMsg(text) {
    document.getElementById('sys-msg').innerText = text;
  }

  // 익명 로그인 수행 (Firestore 접근 권한 획득용)
  showSysMsg("서버에 연결 중입니다...");
  document.getElementById('btn-login').disabled = true;

  signInAnonymously(auth).catch((error) => {
    console.error("Auth Error:", error);
    showSysMsg("서버 연결에 실패했습니다. (DB 권한 확인 필요)");
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      showSysMsg(""); // 연결 성공 시 메시지 지움
      document.getElementById('btn-login').disabled = false;
    }
  });

  // --------------------------------------------------------
  // 게임 로직 상태 변수
  // --------------------------------------------------------
  let userInfo = null;
  let p1Score = 0;
  let p2Score = 0;
  let gameState = 'wait'; // wait, play, buzzed
  let activePlayer = 0;
  let currentQuestionIndex = 0;
  const maxQuestions = 5; // 한 게임당 5문제 출제

  const questionBank = [
    { text: "Go straight 1 block. It's on your left.", answer: "Park" },
    { text: "Go straight 1 block. It's on your right.", answer: "Bank" },
    { text: "Go straight 2 blocks. It's on your left.", answer: "Library" },
    { text: "Go straight 2 blocks. It's on your right.", answer: "Police Station" },
    { text: "Go straight 3 blocks. It's on your left.", answer: "School" },
    { text: "Go straight 3 blocks. It's on your right.", answer: "Hospital" },
    { text: "It's next to the Hospital.", answer: "School" },
    { text: "It's across from the Park.", answer: "Bank" }
  ];
  let shuffledQuestions = [];

  // 로그인 버튼 이벤트
  document.getElementById('btn-login').addEventListener('click', () => {
    const g = document.getElementById('inp-grade').value.trim();
    const c = document.getElementById('inp-class').value.trim();
    const n = document.getElementById('inp-num').value.trim();
    const name = document.getElementById('inp-name').value.trim();

    if (!g || !c || !n || !name) {
      showSysMsg("모든 정보(학년/반/번호/이름)를 입력해주세요!");
      return;
    }

    userInfo = {
      affiliation: `${g}학년 ${c}반 ${n}번`,
      name: name
    };

    // 패널 전환
    document.getElementById('login-panel').classList.remove('active');
    document.getElementById('game-panel').classList.add('active');
    
    startGame();
  });

  function startGame() {
    p1Score = 0; p2Score = 0;
    updateScoreUI();
    currentQuestionIndex = 0;
    
    // 문제 랜덤 섞기
    shuffledQuestions = [...questionBank].sort(() => Math.random() - 0.5);
    nextQuestion();
  }

  function nextQuestion() {
    if (currentQuestionIndex >= maxQuestions) {
      endGame();
      return;
    }

    gameState = 'play';
    activePlayer = 0;
    document.getElementById('box-p1').classList.remove('active');
    document.getElementById('box-p2').classList.remove('active');
    
    document.getElementById('game-msg').innerHTML = 
      `Q${currentQuestionIndex + 1}. ${shuffledQuestions[currentQuestionIndex].text}` + 
      `<br><span style="font-size:16px; color:#6b7280; font-weight:normal;">(먼저 버저 A 또는 L 키를 누르세요!)</span>`;
  }

  // 버저 처리 함수
  window.triggerBuzzer = function(playerNum) {
    if (gameState !== 'play') return;
    
    gameState = 'buzzed';
    activePlayer = playerNum;
    
    if (playerNum === 1) {
      document.getElementById('box-p1').classList.add('active');
      document.getElementById('game-msg').innerHTML = `<span style='color:#ef4444'>P1(빨강)</span> 버저! 정답 건물을 클릭하세요.`;
    } else {
      document.getElementById('box-p2').classList.add('active');
      document.getElementById('game-msg').innerHTML = `<span style='color:#4f46e5'>P2(파랑)</span> 버저! 정답 건물을 클릭하세요.`;
    }
  };

  // 키보드 리스너
  window.addEventListener('keydown', (e) => {
    if (gameState !== 'play') return;
    const key = e.key.toLowerCase();
    if (key === 'a' || key === 'ㅁ') triggerBuzzer(1);
    if (key === 'l' || key === 'ㅣ') triggerBuzzer(2);
  });

  // 건물 클릭 (정답 확인)
  document.querySelectorAll('.building').forEach(el => {
    el.addEventListener('click', () => {
      if (gameState !== 'buzzed') return;
      
      const selectedAnswer = el.getAttribute('data-answer');
      const correctAnswer = shuffledQuestions[currentQuestionIndex].answer;
      
      if (selectedAnswer === correctAnswer) {
        if (activePlayer === 1) p1Score++; else p2Score++;
        document.getElementById('game-msg').innerHTML = `🎉 <span style='color:#16a34a'>정답입니다!</span> +1점`;
      } else {
        if (activePlayer === 1) p1Score--; else p2Score--;
        document.getElementById('game-msg').innerHTML = `❌ <span style='color:#dc2626'>오답!</span> 정답은 ${correctAnswer}입니다. -1점`;
      }
      
      updateScoreUI();
      gameState = 'wait';
      currentQuestionIndex++;
      
      setTimeout(nextQuestion, 2000);
    });
  });

  function updateScoreUI() {
    document.getElementById('score-p1').innerText = p1Score;
    document.getElementById('score-p2').innerText = p2Score;
  }

  // --------------------------------------------------------
  // 게임 종료 및 Firestore 연동
  // --------------------------------------------------------
  async function endGame() {
    document.getElementById('game-panel').classList.remove('active');
    document.getElementById('result-panel').classList.add('active');
    document.getElementById('result-sys-msg').innerText = "기록을 서버에 전송하는 중입니다...";

    if (!currentUser) {
      document.getElementById('result-sys-msg').innerText = "인증 오류: 서버에 연결되지 않아 점수가 저장되지 않습니다.";
      loadLeaderboard();
      return;
    }

    // 둘 중 최고 점수를 해당 플레이어의 기록으로 등록
    const finalScore = Math.max(p1Score, p2Score);

    try {
      // 규칙 1 준수: 명확한 Path 구조 사용
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'hallOfFame');
      
      await addDoc(colRef, {
        affiliation: userInfo.affiliation,
        name: userInfo.name,
        score: finalScore,
        timestamp: new Date().toISOString()
      });
      
      document.getElementById('result-sys-msg').innerText = `게임 종료! 최고 점수 ${finalScore}점이 전송되었습니다.`;
      loadLeaderboard();

    } catch (err) {
      console.error("Save Error:", err);
      document.getElementById('result-sys-msg').innerText = "오류: 점수를 서버에 저장하지 못했습니다.";
      loadLeaderboard();
    }
  }

  // 명예의 전당 조회
  async function loadLeaderboard() {
    if (!currentUser) return;
    
    const tbody = document.getElementById('leaderboard-body');
    
    try {
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'hallOfFame');
      
      // 규칙 2 준수: 단순 쿼리 후 JavaScript 메모리 단에서 정렬 (Complex Query 방지)
      const querySnapshot = await getDocs(colRef);
      let records = [];
      
      querySnapshot.forEach((doc) => {
        records.push(doc.data());
      });

      // 점수 내림차순 정렬 및 상위 10개 추출
      records.sort((a, b) => b.score - a.score);
      records = records.slice(0, 10);

      tbody.innerHTML = ""; // 초기화
      
      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">아직 등록된 랭킹이 없습니다.</td></tr>`;
      } else {
        records.forEach((r, idx) => {
          // 1~3위는 메달 아이콘 추가
          const rankIcon = idx === 0 ? '🥇 ' : idx === 1 ? '🥈 ' : idx === 2 ? '🥉 ' : '';
          tbody.innerHTML += `
            <tr>
              <td>${rankIcon}${idx + 1}위</td>
              <td>${r.affiliation}</td>
              <td><b>${r.name}</b></td>
              <td style="color:#2563eb; font-weight:bold;">${r.score}점</td>
            </tr>
          `;
        });
      }

    } catch (err) {
      console.error("Load Error:", err);
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>`;
    }
  }

</script>
</body>
</html>
