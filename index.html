<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Place - 실시간 1:1 대결</title>
    <!-- 폭죽 효과 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        /* 창 크기가 변해도 중앙에 위치하도록 설정 */
        body { margin: 0; background-color: #2c3e50; font-family: 'Nunito', 'Jua', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* 고정 크기를 가지며 스케일링으로 반응형 대응 */
        .app-container { width: 1280px; height: 720px; background-color: #f4f6f7; position: relative; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-shrink: 0; transform-origin: center center; transition: transform 0.1s ease-out; }
        
        /* 모달 / 오버레이 (로비, 결과) */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
        .setup-box { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; border: 4px solid #ffb6c1; width: 500px; }
        .setup-box h1 { font-family: 'Jua', sans-serif; font-size: 48px; color: #ff69b4; margin-top: 0; margin-bottom: 10px; }
        
        input { padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; width: 100%; text-align: center; outline: none; font-family: 'Jua', sans-serif; margin-bottom: 15px; }
        input:focus { border-color: #ff69b4; }
        
        .btn { background: #ff69b4; color: white; border: none; padding: 15px; font-size: 20px; border-radius: 15px; cursor: pointer; font-family: 'Jua', sans-serif; transition: 0.2s; width: 100%; margin-bottom: 10px; }
        .btn:hover { background: #ff1493; transform: scale(1.02); }
        .btn.secondary { background: #00bcd4; }
        .btn.secondary:hover { background: #00acc1; }
        .btn:disabled { background: #ccc !important; cursor: not-allowed; transform: none; }

        /* 좌우 패널 */
        .side-panel { width: 300px; height: 100%; padding: 15px; display: flex; flex-direction: column; position: relative; z-index: 100; }
        .panel-a { background-color: #fff0f5; border-right: 3px solid #f8bbd0; }
        .panel-b { background-color: #ffffe0; border-left: 3px solid #fff59d; }
        
        .panel-header { font-size: 24px; font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .panel-a .panel-header { color: #d81b60; }
        .panel-b .panel-header { color: #f57f17; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; background: white; border: 2px solid; }

        .cmd-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn-cmd { flex: 1; padding: 10px 5px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; font-family: 'Nunito', sans-serif; transition: 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
        .btn-cmd:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-cmd:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: translateY(4px); }
        .btn-dir { background-color: #00bcd4; }
        .btn-num { background-color: #ba68c8; }
        .btn-unit { background-color: #ab47bc; }
        
        .clear-btn { background: #ef5350; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; box-shadow: 0 3px 0 #c62828; }
        .clear-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .clear-btn:disabled { background: #ccc; box-shadow: none; transform: translateY(3px); }

        .cmd-list { flex-grow: 1; background: white; border-radius: 10px; padding: 10px; overflow-y: auto; border: 2px dashed #ccc; font-size: 16px; font-weight: bold; color: #333; margin-top: 10px; }
        .cmd-item { padding: 8px 5px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px;}
        .cmd-item i { color: #888; font-size: 14px; }
        
        .ready-btn { width: 100%; padding: 15px; font-size: 24px; font-weight: 900; color: white; border: none; border-radius: 15px; margin-top: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 0 rgba(0,0,0,0.15); }
        .panel-a .ready-btn { background-color: #f8bbd0; color: #d81b60; box-shadow: 0 5px 0 #f48fb1; }
        .panel-b .ready-btn { background-color: #fff59d; color: #f57f17; box-shadow: 0 5px 0 #fff176; }
        .panel-a .ready-btn.active { background-color: #d81b60; color: white; box-shadow: none; transform: translateY(5px); }
        .panel-b .ready-btn.active { background-color: #f57f17; color: white; box-shadow: none; transform: translateY(5px); }
        .ready-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 중앙 패널 */
        .center-panel { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 10px; position: relative; background: #eceff1; }
        
        .top-info { display: flex; justify-content: space-between; align-items: center; background: #34495e; color: white; padding: 8px 15px; border-radius: 10px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .room-code { color: #f1c40f; letter-spacing: 2px; font-size: 20px;}

        .question-bar { background: white; border-radius: 15px; padding: 15px; text-align: center; border: 3px solid #bdc3c7; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .question-bar h2 { margin: 0; font-size: 30px; color: #2c3e50; }
        .question-bar p { margin: 5px 0 0 0; color: #7f8c8d; font-family: 'Jua', sans-serif; font-size: 20px; }
        .tts-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: #f1c40f; color: white; border: none; font-size: 22px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 0 #f39c12; }
        .tts-btn:active { transform: translateY(calc(-50% + 4px)); box-shadow: none; }

        /* [수정사항 3] 실제 지도 디자인 (4x4 Grid) */
        .map-container { flex-grow: 1; background-color: #7cb342; border-radius: 15px; position: relative; overflow: hidden; border: 6px solid #558b2f; box-shadow: inset 0 0 30px rgba(0,0,0,0.3); }
        /* 아스팔트 도로 */
        .road-h { position: absolute; width: 100%; height: 50px; background: #546e7a; z-index: 1; border-top: 2px solid #37474f; border-bottom: 2px solid #37474f; }
        .road-v { position: absolute; height: 100%; width: 50px; background: #546e7a; z-index: 1; border-left: 2px solid #37474f; border-right: 2px solid #37474f; }
        .road-center { position: absolute; width: 46px; height: 46px; background: #546e7a; z-index: 2; } /* 교차로 선 지우기용 */
        /* 점선 중앙선 */
        .dash-h { position: absolute; width: 100%; height: 4px; background: repeating-linear-gradient(90deg, transparent, transparent 15px, #fbc02d 15px, #fbc02d 30px); z-index: 3;}
        .dash-v { position: absolute; height: 100%; width: 4px; background: repeating-linear-gradient(0deg, transparent, transparent 15px, #fbc02d 15px, #fbc02d 30px); z-index: 3;}

        /* 입체적인 건물 디자인 */
        .place { position: absolute; width: 56px; height: 56px; background: #ffffff; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; border: 3px solid #2c3e50; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1), 0 8px 12px rgba(0,0,0,0.4); transform: translate(-50%, -60%); transition: transform 0.3s, border-color 0.3s; }
        .place.target { border-color: #e74c3c; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1), 0 8px 0 #c0392b, 0 0 25px #e74c3c; transform: translate(-50%, -65%) scale(1.15); z-index: 6;}
        .place .emoji { font-size: 22px; margin-bottom: -2px; }
        .place .name { font-size: 11px; font-weight: 900; background: rgba(255,255,255,0.95); padding: 2px 4px; border-radius: 4px; margin-top: -2px; color: #2c3e50;}

        /* 플레이어 마커 & 이름표 */
        .marker { position: absolute; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; z-index: 10; transition: left 0.4s linear, top 0.4s linear; transform: translate(-50%, -50%); border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .marker-a { background-color: #e91e63; }
        .marker-b { background-color: #ff9800; display: none; }
        .dir-arrow { position: absolute; color: white; font-size: 16px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        
        /* [수정사항 1] 출발점 밑에 참가자 이름 표시 */
        .marker-name { position: absolute; top: 40px; background: rgba(255,255,255,0.9); color: #333; font-size: 13px; font-weight: 900; padding: 2px 8px; border-radius: 6px; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.3); border: 2px solid; pointer-events: none;}
        .marker-a .marker-name { border-color: #e91e63; }
        .marker-b .marker-name { border-color: #ff9800; }

        .bottom-bar { background: white; border-radius: 15px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border: 3px solid #bdc3c7; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .score-info { font-size: 22px; font-weight: 900; background: #f8f9fa; padding: 5px 15px; border-radius: 10px; border: 2px solid #eee;}
        .score-a { color: #e91e63; border-color: #f8bbd0; }
        .score-b { color: #e67e22; border-color: #ffe0b2; }
        
        /* 인게임 모달 알림 */
        #ingame-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(44, 62, 80, 0.9); color: white; padding: 20px 40px; border-radius: 15px; font-size: 28px; font-weight: bold; z-index: 100; text-align: center; display: none; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 3px solid #34495e; }

        /* 명예의 전당 */
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .leaderboard-table th, .leaderboard-table td { padding: 12px; border-bottom: 1px solid #eee; font-size: 18px; font-family: 'Jua', sans-serif;}
        .leaderboard-table th { background: #fce4ec; color: #d81b60; border-top: 3px solid #f8bbd0;}
    </style>
</head>
<body>

<div class="app-container">

    <!-- 1. 로비 오버레이 -->
    <div id="lobby-overlay" class="overlay">
        <div class="setup-box">
            <h1>🗺️ Find the Place</h1>
            <p style="font-size:18px; color:#666; margin-bottom: 20px;">친구와 떨어져서 즐기는 실시간 길 찾기 배틀!</p>
            
            <div id="lobby-state-0">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="number" id="inp-grade" placeholder="학년" min="1" max="6">
                    <input type="number" id="inp-class" placeholder="반" min="1" max="20">
                    <input type="number" id="inp-num" placeholder="번호" min="1" max="50">
                </div>
                <input type="text" id="inp-name" placeholder="이름 입력" maxlength="8">
                <button id="btn-next-step" class="btn">다음 단계로</button>
            </div>
            
            <div id="lobby-state-1" class="hidden">
                <p id="welcome-msg" style="font-size:24px; font-weight:bold; color:#e91e63; margin-bottom:20px;"></p>
                <button id="btn-create" class="btn">새 게임 방 만들기 (Host)</button>
                <div style="margin: 15px 0; color: #bdc3c7; font-weight: bold;">OR</div>
                <input type="text" id="inp-room" placeholder="참여 코드 4자리 입력" maxlength="4" style="font-size: 24px; letter-spacing: 5px; font-weight: bold;">
                <button id="btn-join" class="btn secondary">방 참여하기 (Join)</button>
            </div>
            
            <div id="lobby-state-2" class="hidden">
                <h2>방 코드: <span id="display-room-code" style="color:#e91e63; font-size:42px; letter-spacing: 3px;"></span></h2>
                <p style="font-size: 18px;">상대방에게 이 코드를 알려주세요!</p>
                <div style="margin: 30px; font-size: 22px; color: #3498db; font-weight: bold;">상대방을 기다리는 중... <i class="fa-solid fa-spinner fa-spin"></i></div>
            </div>

            <!-- 메시지 출력 -->
            <p id="sys-msg" style="color:#e74c3c; font-weight:bold; margin-top:15px; line-height: 1.4; font-size: 18px;"></p>
        </div>
    </div>

    <!-- 2. 결과 오버레이 -->
    <div id="result-overlay" class="overlay hidden">
        <div class="setup-box" style="width: 650px;">
            <h1 style="font-size: 56px;">🏆 게임 종료!</h1>
            <p id="result-msg" style="font-size:32px; color:#e91e63; margin-bottom: 20px; font-weight: bold;"></p>
            
            <table class="leaderboard-table">
                <thead><tr><th>순위</th><th>소속</th><th>이름</th><th>점수</th></tr></thead>
                <tbody id="leaderboard-body"><tr><td colspan="4">기록을 불러오는 중... <i class="fa-solid fa-spinner fa-spin"></i></td></tr></tbody>
            </table>
            <button onclick="location.reload()" class="btn secondary" style="margin-top:30px;">메인 화면으로 돌아가기</button>
        </div>
    </div>

    <!-- 메인 게임 영역 -->
    
    <!-- Left Panel: P1 (A) -->
    <div class="side-panel panel-a" id="panel-A">
        <div class="panel-header">
            <div class="player-info"><div class="avatar" style="border-color:#e91e63; color:#e91e63;">👦</div><span id="name-a">Player 1</span></div>
            <button class="clear-btn" id="btn-clear-a" onclick="handleClear()">Clear</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Go straight')">Go straight</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn left')">Turn left</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn right')">Turn right</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 1)">1</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 2)">2</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 3)">3</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'block')">block</button>
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'blocks')">blocks</button>
        </div>
        <div class="cmd-list" id="cmd-list-a"><div style="color:#aaa; text-align:center; margin-top:20px;">방향을 선택해 길을 안내하세요!</div></div>
        <button class="ready-btn" id="btn-ready-a" onclick="handleReady()">READY</button>
    </div>

    <!-- Center Panel: Map -->
    <div class="center-panel">
        <div class="top-info">
            <span>나의 역할: <span id="my-role-badge" style="color:#f1c40f;">-</span></span>
            <span>Room: <span id="room-code-badge" class="room-code">----</span></span>
        </div>
        
        <div class="question-bar">
            <h2 id="question-text">Waiting...</h2>
            <p id="question-sub">친구의 입장을 기다리고 있습니다.</p>
            <button class="tts-btn" onclick="speakQuestion()"><i class="fa-solid fa-volume-high"></i></button>
        </div>
        
        <div class="map-container" id="map">
            <div class="marker marker-a" id="marker-a">
                <div class="dir-arrow" id="dir-a"></div>
                <div class="marker-name" id="marker-name-a"></div> <!-- 이름 표시 영역 -->
            </div>
            <div class="marker marker-b" id="marker-b">
                <div class="dir-arrow" id="dir-b"></div>
                <div class="marker-name" id="marker-name-b"></div> <!-- 이름 표시 영역 -->
            </div>
        </div>
        
        <div class="bottom-bar">
            <span class="score-info score-a" id="ui-score-a">P1: 0/9</span>
            <span id="ui-q-num" style="font-weight:900; color:#34495e; font-size:24px;">Q 1 / 9</span>
            <span class="score-info score-b" id="ui-score-b">P2: 0/9</span>
        </div>

        <div id="ingame-msg">애니메이션 진행 중...</div>
    </div>

    <!-- Right Panel: P2 (B) -->
    <div class="side-panel panel-b" id="panel-B">
        <div class="panel-header">
            <div class="player-info"><div class="avatar" style="border-color:#e67e22; color:#e67e22;">👧</div><span id="name-b">Player 2</span></div>
            <button class="clear-btn" id="btn-clear-b" onclick="handleClear()">Clear</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Go straight')">Go straight</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn left')">Turn left</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn right')">Turn right</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 1)">1</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 2)">2</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 3)">3</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'block')">block</button>
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'blocks')">blocks</button>
        </div>
        <div class="cmd-list" id="cmd-list-b"><div style="color:#aaa; text-align:center; margin-top:20px;">방향을 선택해 길을 안내하세요!</div></div>
        <button class="ready-btn" id="btn-ready-b" onclick="handleReady()">READY</button>
    </div>

</div>

<script type="module">
    // --- [수정 1] 브라우저 창 크기에 따른 화면 자동 축소 (반응형) ---
    function resizeApp() {
        const app = document.querySelector('.app-container');
        const scaleX = window.innerWidth / 1280;
        const scaleY = window.innerHeight / 720;
        const scale = Math.min(scaleX, scaleY) * 0.95; // 화면이 너무 꽉 차지 않게 여백 확보
        if (scale < 1) app.style.transform = `scale(${scale})`;
        else app.style.transform = 'scale(1)';
    }
    window.addEventListener('resize', resizeApp);
    resizeApp();

    // --- [수정 3] 효과음 생성 (웹 오디오 API - 다운로드 필요 없음) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    document.body.addEventListener('click', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if(type === 'success') {
            // 정답 사운드 (띠리링~ 상승음)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        } else {
            // 오답 사운드 (삐이익~ 하강음)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // --- Firebase 설정 ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCAR_dSA_jViVY0RZAI3s41a39u9NufFj8",
        authDomain: "where-2599e.firebaseapp.com",

    function listenRoom(roomRef) {
        document.getElementById('lobby-overlay').classList.add('hidden');
        document.getElementById('my-role-badge').innerText = myRole === 'A' ? "P1 (Host)" : "P2 (Guest)";
        document.getElementById('room-code-badge').innerText = myRoomId;
        
        const oppRole = myRole === 'A' ? 'B' : 'A';
        const oppPanel = document.getElementById(`panel-${oppRole}`);
        oppPanel.style.opacity = '0.5';
        oppPanel.style.pointerEvents = 'none';

        roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
            if(!snapshot.exists()) return;
            const data = snapshot.data();
            localDataCache = data;
            
            updateUI(data);

            if(data.state === 'animating' && !window.isAnimating) {
                runAnimations(data);
            }
            if(data.state === 'playing' && data.pA.ready && data.pB && data.pB.ready) {
                if(myRole === 'A') updateDoc(roomRef, { state: 'animating' }).catch(console.error);
            }
        });
    }

    // TTS 기능: 문제 읽어주기
    window.speakQuestion = () => {
        const text = document.getElementById('question-text').innerText;
        if(speechSynthesis.speaking) speechSynthesis.cancel();
        
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; 
        u.rate = 0.9; 
        speechSynthesis.speak(u);
    };

    function updateUI(data) {
        // [수정사항 1] 마커 아래에 이름 표시 반영
        document.getElementById('name-a').innerText = data.pA.name;
        document.getElementById('marker-name-a').innerText = data.pA.name;
        
        if(data.pB) {
            document.getElementById('name-b').innerText = data.pB.name;
            document.getElementById('marker-name-b').innerText = data.pB.name;
            document.getElementById('marker-b').style.display = 'flex';
        }

        const q = QUESTIONS[data.currentQ];
        if(data.state === 'playing') {
            document.getElementById('question-text').innerText = `Where is the ${q.target}?`;
            document.getElementById('question-sub').innerText = q.sub;
            document.getElementById('ui-q-num').innerText = `Q ${data.currentQ + 1} / 9`;
            
            document.querySelectorAll('.place').forEach(el => el.classList.remove('target'));
            document.getElementById(`place-${q.target}`).classList.add('target');
            
            if(!window.isAnimating) {
                renderMarker('a', data.pA.pos);
                if(data.pB) renderMarker('b', data.pB.pos);
            }
            updateMyButtons(data);

            // [수정사항 2] 문제 시작 시 자동 TTS 반복 재생 보장
            if(lastReadQuestionIndex !== data.currentQ && !window.isAnimating) {
                lastReadQuestionIndex = data.currentQ;
                // UI가 안정화된 후 0.8초 뒤 문제 낭독
                setTimeout(() => { if(data.state === 'playing') speakQuestion(); }, 800); 
            }
        }

        document.getElementById('ui-score-a').innerText = `P1: ${data.pA.score}/9`;
        document.getElementById('ui-score-b').innerText = `P2: ${data.pB ? data.pB.score : 0}/9`;

        renderCmdList('A', data.pA.cmds);
        if(data.pB) renderCmdList('B', data.pB.cmds);

        document.getElementById('btn-ready-a').classList.toggle('active', data.pA.ready);
        document.getElementById('btn-ready-b').classList.toggle('active', data.pB ? data.pB.ready : false);
    }

    function updateMyButtons(data) {
        const myData = data[`p${myRole}`];
        if(!myData) return;

        const isReady = myData.ready;
        const panel = document.getElementById(`panel-${myRole}`);
        
        panel.querySelectorAll('.btn-dir').forEach(b => b.disabled = isReady || localPending.dir);
        panel.querySelectorAll('.btn-num').forEach(b => b.disabled = isReady || !localPending.dir || localPending.num);
        panel.querySelectorAll('.btn-unit').forEach(b => b.disabled = isReady || !localPending.num);
        
        panel.querySelector('.clear-btn').disabled = isReady;
        panel.querySelector('.ready-btn').innerText = isReady ? "WAITING..." : "READY GO!";
    }

    // [수정사항 4] 어구 블럭 반복 처리 방식 변경 (Turn left/right는 바로 문장 완성)
    window.handleCmd = async (type, val) => {
        if(localDataCache.state !== 'playing') return;
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
        const myKey = `p${myRole}`;
        const myCmds = localDataCache[myKey].cmds;

        if(type === 'dir') {
            if(val === 'Turn left' || val === 'Turn right') {
                // 방향 전환은 클릭 즉시 하나의 명령어로 완결되어 여러 번 자유롭게 쓸 수 있음
                const newCmd = { str: `${val}.`, action: val, dist: 0 };
                await updateDoc(roomRef, { [`${myKey}.cmds`]: [...myCmds, newCmd] }).catch(console.error);
                localPending = {}; 
            } else {
                localPending.dir = val; // Go straight는 숫자 입력을 기다림
            }
        }
        else if(type === 'num') localPending.num = val;
        else if(type === 'unit') {
            const str = `${localPending.dir} ${localPending.num} ${val}.`;
            const newCmd = { str: str, action: localPending.dir, dist: localPending.num };
            
            await updateDoc(roomRef, { [`${myKey}.cmds`]: [...myCmds, newCmd] }).catch(console.error);
            localPending = {}; // 등록 완료 시 대기 상태 해제하여 또 입력 가능하게 만듦
        }
        updateMyButtons(localDataCache);
    };

    window.handleClear = async () => {
        if(localDataCache.state !== 'playing') return;
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
        await updateDoc(roomRef, { [`p${myRole}.cmds`]: [] }).catch(console.error);
        localPending = {};
        updateMyButtons(localDataCache);
    };

    window.handleReady = async () => {
        if(localDataCache.state !== 'playing') return;
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
        const myKey = `p${myRole}`;
        const isReady = localDataCache[myKey].ready;
        await updateDoc(roomRef, { [`${myKey}.ready`]: !isReady }).catch(console.error);
    };

    window.isAnimating = false;
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function runAnimations(data) {
        window.isAnimating = true;
        showMsg("캐릭터가 이동합니다! 🏃‍♂️💨");
        
        let posA = {...data.pA.pos};
        let posB = {...data.pB.pos};
        
        await Promise.all([
            animatePath('a', posA, data.pA.cmds),
            animatePath('b', posB, data.pB.cmds)
        ]);

        // 애니메이션 종료 후 정답 판정
        const targetId = QUESTIONS[data.currentQ].target;
        const tObj = PLACES.find(p => p.id === targetId);
        
        let aWin = (posA.x === tObj.x && posA.y === tObj.y);
        let bWin = (posB.x === tObj.x && posB.y === tObj.y);

        let myWin = (myRole === 'A') ? aWin : bWin;
        let oppWin = (myRole === 'A') ? bWin : aWin;

        // [수정사항 3] 정답 사운드 및 폭죽 애니메이션
        if (myWin) {
            playSound('success');
            // 화면 중앙에서 폭죽 효과 발사!
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 }, zIndex: 3000 });
            
            if (oppWin) showMsg("두 명 모두 길 찾기에 성공했어요! 🎊");
            else showMsg("목적지에 도착했습니다! ✨ 정답! ✨");
        } else {
            playSound('fail');
            if (oppWin) showMsg("앗, 나는 실패했지만 상대방은 도착했어요! 😅");
            else showMsg("목적지를 찾지 못했어요 😢");
        }

        await delay(3000); // 폭죽과 메시지 확인을 위해 충분히 대기

        if(myRole === 'A') {
            let aScore = data.pA.score + (aWin ? 1 : 0);
            let bScore = data.pB.score + (bWin ? 1 : 0);
            const nextQ = data.currentQ + 1;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
            
            if(nextQ >= 9) {
                await updateDoc(roomRef, {
                    state: 'finished',
                    'pA.score': aScore, 'pB.score': bScore
                }).catch(console.error);
                finishGame(aScore, bScore, data.pA.name, data.pB.name);
            } else {
                await updateDoc(roomRef, {
                    state: 'playing', currentQ: nextQ,
                    'pA.score': aScore, 'pB.score': bScore,
                    'pA.cmds': [], 'pB.cmds': [],
                    'pA.ready': false, 'pB.ready': false,
                    'pA.pos': {...QUESTIONS[nextQ].a_start},
                    'pB.pos': {...QUESTIONS[nextQ].b_start}
                }).catch(console.error);
            }
        }
        window.isAnimating = false;
    }

    async function animatePath(markerId, pos, cmds) {
        for(let cmd of cmds) {
            if(cmd.action === 'Turn left') pos.d = (pos.d + 3) % 4;
            else if(cmd.action === 'Turn right') pos.d = (pos.d + 1) % 4;
            
            renderMarker(markerId, pos);
            if(cmd.action.includes('Turn')) await delay(500); // 회전 시간 충분히 확보
            
            for(let i=0; i<cmd.dist; i++) {
                let nx = pos.x + DIRS[pos.d][0];
                let ny = pos.y + DIRS[pos.d][1];
                // 지도(4x4) 바깥으로 나가는 것 방지
                if(nx >= 0 && nx < 4 && ny >= 0 && ny < 4) {
                    pos.x = nx; pos.y = ny;
                    renderMarker(markerId, pos);
                    await delay(600);
                } else {
                    break; // 막힌 길이 나오면 중지
                }
            }
        }
    }

    function renderMarker(id, pos) {
        const el = document.getElementById(`marker-${id}`);
        el.style.left = `${GRID_X[pos.x]}px`;
        el.style.top = `${GRID_Y[pos.y]}px`;
        el.querySelector('.dir-arrow').innerText = ARROWS[pos.d];
    }

    function renderCmdList(role, cmds) {
        const list = document.getElementById(`cmd-list-${role.toLowerCase()}`);
        if(!cmds || cmds.length === 0) list.innerHTML = `<div style="color:#aaa; text-align:center; margin-top:20px;">명령어를 만들어 길을 안내하세요!</div>`;
        else {
            list.innerHTML = cmds.map((c, idx) => `
                <div class="cmd-item">
                    <i class="fa-solid fa-${c.action.includes('left') ? 'arrow-rotate-left' : (c.action.includes('right') ? 'arrow-rotate-right' : 'arrow-up')}"></i> 
                    ${c.str}
                </div>
            `).join('');
        }
        list.scrollTop = list.scrollHeight;
    }

    async function finishGame(scoreA, scoreB, nameA, nameB) {
        document.getElementById('result-overlay').classList.remove('hidden');
        if(roomUnsubscribe) roomUnsubscribe();
        
        let winMsg = scoreA > scoreB ? `${nameA} 승리! 🏆` : (scoreB > scoreA ? `${nameB} 승리! 🏆` : "아름다운 무승부! 🤝");
        document.getElementById('result-msg').innerText = winMsg;
        
        // 최종 종료 폭죽 파티!
        confetti({ particleCount: 400, spread: 150, origin: { y: 0.5 }, zIndex: 4000 });
        playSound('success');

        try {
            const hofRef = collection(db, 'artifacts', appId, 'public', 'data', 'hallOfFame');
            if(myRole === 'A') {
                await addDoc(hofRef, { name: nameA, affiliation: localDataCache.pA.affiliation, score: scoreA, ts: Date.now() });
                await addDoc(hofRef, { name: nameB, affiliation: localDataCache.pB.affiliation, score: scoreB, ts: Date.now() });
            }
            
            setTimeout(async () => {
                const snap = await getDocs(hofRef);
                let records = [];
                snap.forEach(doc => records.push(doc.data()));
                records.sort((a,b) => b.score - a.score);
                records = records.slice(0, 10);
                
                document.getElementById('leaderboard-body').innerHTML = records.map((r, i) => `
                    <tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':''}${i+1}위</td>
                    <td>${r.affiliation}</td>
                    <td><b>${r.name}</b></td><td style="color:#d81b60; font-weight:bold;">${r.score}점</td></tr>
                `).join('');
            }, 1000);

        } catch (e) {
            console.error("Hall of Fame Error:", e);
            document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" style="color:red;">랭킹 로딩 실패</td></tr>`;
        }
    }
</script>
</body>
</html>
