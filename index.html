<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Place - 실시간 1:1 대결</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; background-color: #e2e8f0; font-family: 'Nunito', 'Jua', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 1280px; height: 100vh; max-height: 720px; background-color: #fffaf0; position: relative; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); overflow: hidden; display: flex; }
        
        /* 모달 / 오버레이 (로비, 결과) */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
        .setup-box { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 3px solid #ffb6c1; width: 500px; }
        .setup-box h1 { font-family: 'Jua', sans-serif; font-size: 48px; color: #ff69b4; margin-top: 0; margin-bottom: 10px; }
        
        input { padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; width: 100%; text-align: center; outline: none; font-family: 'Jua', sans-serif; margin-bottom: 15px; }
        input:focus { border-color: #ff69b4; }
        
        .btn { background: #ff69b4; color: white; border: none; padding: 15px; font-size: 20px; border-radius: 15px; cursor: pointer; font-family: 'Jua', sans-serif; transition: 0.2s; width: 100%; margin-bottom: 10px; }
        .btn:hover { background: #ff1493; transform: scale(1.02); }
        .btn.secondary { background: #00bcd4; }
        .btn.secondary:hover { background: #00acc1; }
        .btn:disabled { background: #ccc !important; cursor: not-allowed; transform: none; }

        /* 좌우 패널 */
        .side-panel { width: 300px; height: 100%; padding: 15px; display: flex; flex-direction: column; position: relative; border-left: 2px solid #eee; border-right: 2px solid #eee; }
        .panel-a { background-color: #fff0f5; }
        .panel-b { background-color: #ffffe0; }
        
        .panel-header { font-size: 24px; font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .panel-a .panel-header { color: #d81b60; }
        .panel-b .panel-header { color: #f57f17; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; background: white; border: 2px solid; }

        .cmd-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn-cmd { flex: 1; padding: 10px 5px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; font-family: 'Nunito', sans-serif; transition: 0.1s; }
        .btn-cmd:active { transform: translateY(2px); }
        .btn-cmd:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-dir { background-color: #00bcd4; }
        .btn-num { background-color: #ba68c8; }
        .btn-unit { background-color: #ab47bc; }
        
        .clear-btn { background: #ef5350; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .clear-btn:disabled { background: #ccc; }

        .cmd-list { flex-grow: 1; background: white; border-radius: 10px; padding: 10px; overflow-y: auto; border: 2px dashed #ccc; font-size: 16px; font-weight: bold; color: #333; margin-top: 10px; }
        .cmd-item { padding: 5px 0; border-bottom: 1px solid #eee; }
        
        .ready-btn { width: 100%; padding: 15px; font-size: 24px; font-weight: 900; color: white; border: none; border-radius: 15px; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        .panel-a .ready-btn { background-color: #f8bbd0; color: #d81b60; }
        .panel-b .ready-btn { background-color: #fff59d; color: #f57f17; }
        .panel-a .ready-btn.active { background-color: #d81b60; color: white; }
        .panel-b .ready-btn.active { background-color: #f57f17; color: white; }
        .ready-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 중앙 패널 */
        .center-panel { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; gap: 10px; position: relative; }
        
        .top-info { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 5px 15px; border-radius: 10px; font-size: 18px; font-weight: bold; }
        .room-code { color: #ffeb3b; letter-spacing: 2px; }

        .question-bar { background: white; border-radius: 15px; padding: 15px; text-align: center; border: 2px solid #ddd; position: relative; }
        .question-bar h2 { margin: 0; font-size: 28px; color: #333; }
        .question-bar p { margin: 5px 0 0 0; color: #666; font-family: 'Jua', sans-serif; font-size: 18px; }
        .tts-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: #fff9c4; border: none; font-size: 24px; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        /* 지도 */
        .map-container { flex-grow: 1; background-color: #aed581; border-radius: 15px; position: relative; overflow: hidden; border: 4px solid #7cb342; }
        .road-h { position: absolute; width: 100%; height: 40px; background: #e0e0e0; z-index: 1; }
        .road-v { position: absolute; height: 100%; width: 40px; background: #e0e0e0; z-index: 1; }
        .dash-h { position: absolute; width: 100%; height: 2px; background: repeating-linear-gradient(90deg, transparent, transparent 10px, #ffeb3b 10px, #ffeb3b 20px); top: 19px; z-index: 2;}
        .dash-v { position: absolute; height: 100%; width: 2px; background: repeating-linear-gradient(0deg, transparent, transparent 10px, #ffeb3b 10px, #ffeb3b 20px); left: 19px; z-index: 2;}

        .place { position: absolute; width: 50px; height: 50px; background: white; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border: 2px solid #333; transform: translate(-50%, -50%); transition: 0.3s; }
        .place.target { border-color: #ff1744; box-shadow: 0 0 15px #ff1744; transform: translate(-50%, -50%) scale(1.3); z-index: 6;}
        .place .emoji { font-size: 20px; }
        .place .name { font-size: 10px; font-weight: 900; background: rgba(255,255,255,0.9); padding: 2px; border-radius: 3px; margin-top: -3px;}

        .marker { position: absolute; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; z-index: 10; transition: left 0.5s linear, top 0.5s linear; transform: translate(-50%, -50%); border: 2px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .marker-a { background-color: #ff4081; }
        .marker-b { background-color: #ffb300; display: none; } /* P2가 들어오면 보임 */
        .dir-arrow { position: absolute; color: white; font-size: 14px; font-weight: bold; }

        .bottom-bar { background: white; border-radius: 15px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #ddd; }
        .score-info { font-size: 20px; font-weight: 900; }
        .score-a { color: #d81b60; }
        .score-b { color: #f57f17; }
        
        /* 인게임 모달 알림 */
        #ingame-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px 40px; border-radius: 15px; font-size: 24px; font-weight: bold; z-index: 100; text-align: center; display: none; }

        /* 명예의 전당 */
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .leaderboard-table th, .leaderboard-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: 18px; font-family: 'Jua', sans-serif;}
        .leaderboard-table th { background: #ffe4e1; color: #d81b60; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 1. 로비 오버레이 -->
    <div id="lobby-overlay" class="overlay">
        <div class="setup-box">
            <h1>🗺️ Find the Place</h1>
            <p style="font-size:18px; color:#666; margin-bottom: 20px;">친구와 떨어져서 즐기는 멀티플레이어 게임</p>
            
            <div id="lobby-state-0">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="number" id="inp-grade" placeholder="학년" min="1" max="6">
                    <input type="number" id="inp-class" placeholder="반" min="1" max="20">
                    <input type="number" id="inp-num" placeholder="번호" min="1" max="50">
                </div>
                <input type="text" id="inp-name" placeholder="이름 입력" maxlength="8">
                <button id="btn-next-step" class="btn">다음</button>
            </div>
            
            <div id="lobby-state-1" class="hidden">
                <p id="welcome-msg" style="font-size:22px; font-weight:bold; color:#d81b60; margin-bottom:15px;"></p>
                <button id="btn-create" class="btn">새 게임 방 만들기 (Host)</button>
                <div style="margin: 15px 0; color: #888; font-weight: bold;">OR</div>
                <input type="text" id="inp-room" placeholder="참여 코드 4자리 입력" maxlength="4">
                <button id="btn-join" class="btn secondary">방 참여하기 (Join)</button>
            </div>
            
            <div id="lobby-state-2" class="hidden">
                <h2>방 코드: <span id="display-room-code" style="color:#ff69b4; font-size:36px;"></span></h2>
                <p>친구에게 이 코드를 알려주세요!</p>
                <div style="margin: 20px; font-size: 20px; color: #00bcd4;">친구를 기다리는 중... <i class="fa-solid fa-spinner fa-spin"></i></div>
            </div>

            <!-- 메시지 출력을 위한 공간 -->
            <p id="sys-msg" style="color:red; font-weight:bold; margin-top:15px; line-height: 1.4;"></p>
        </div>
    </div>

    <!-- 2. 결과 오버레이 -->
    <div id="result-overlay" class="overlay hidden">
        <div class="setup-box" style="width: 600px;">
            <h1>🏆 게임 종료!</h1>
            <p id="result-msg" style="font-size:28px; color:#d81b60; margin-bottom: 10px;"></p>
            
            <table class="leaderboard-table">
                <thead><tr><th>순위</th><th>소속</th><th>이름</th><th>점수</th></tr></thead>
                <tbody id="leaderboard-body"><tr><td colspan="4">기록을 불러오는 중...</td></tr></tbody>
            </table>
            <button onclick="location.reload()" class="btn" style="margin-top:20px;">처음으로 돌아가기</button>
        </div>
    </div>

    <!-- 메인 게임 영역 -->
    
    <!-- Left Panel: P1 (A) -->
    <div class="side-panel panel-a" id="panel-A">
        <div class="panel-header">
            <div class="player-info"><div class="avatar" style="border-color:#d81b60; color:#d81b60;">👦</div><span id="name-a">Player 1</span></div>
            <button class="clear-btn" id="btn-clear-a" onclick="handleClear()">Clear</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Go straight')">Go straight</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn left')">Turn left</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn right')">Turn right</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 1)">1</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 2)">2</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 3)">3</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'block')">block</button>
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'blocks')">blocks</button>
        </div>
        <div class="cmd-list" id="cmd-list-a"><div style="color:#aaa; text-align:center; margin-top:10px;">명령어 대기중...</div></div>
        <button class="ready-btn" id="btn-ready-a" onclick="handleReady()">READY</button>
    </div>

    <!-- Center Panel: Map -->
    <div class="center-panel">
        <div class="top-info">
            <span>나의 역할: <span id="my-role-badge" style="color:#ffeb3b;">-</span></span>
            <span>Room: <span id="room-code-badge" class="room-code">----</span></span>
        </div>
        
        <div class="question-bar">
            <h2 id="question-text">Waiting...</h2>
            <p id="question-sub">친구의 입장을 기다리고 있습니다.</p>
            <button class="tts-btn" onclick="speakQuestion()">🔊</button>
        </div>
        
        <div class="map-container" id="map">
            <div class="marker marker-a" id="marker-a"><div class="dir-arrow" id="dir-a"></div></div>
            <div class="marker marker-b" id="marker-b"><div class="dir-arrow" id="dir-b"></div></div>
        </div>
        
        <div class="bottom-bar">
            <span class="score-info score-a" id="ui-score-a">P1: 0/9</span>
            <span id="ui-q-num" style="font-weight:bold; color:#888; font-size:20px;">Q 1 / 9</span>
            <span class="score-info score-b" id="ui-score-b">P2: 0/9</span>
        </div>

        <div id="ingame-msg">애니메이션 진행 중...</div>
    </div>

    <!-- Right Panel: P2 (B) -->
    <div class="side-panel panel-b" id="panel-B">
        <div class="panel-header">
            <div class="player-info"><div class="avatar" style="border-color:#f57f17; color:#f57f17;">👧</div><span id="name-b">Player 2</span></div>
            <button class="clear-btn" id="btn-clear-b" onclick="handleClear()">Clear</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Go straight')">Go straight</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn left')">Turn left</button>
            <button class="btn-cmd btn-dir" onclick="handleCmd('dir', 'Turn right')">Turn right</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 1)">1</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 2)">2</button>
            <button class="btn-cmd btn-num" onclick="handleCmd('num', 3)">3</button>
        </div>
        <div class="cmd-group">
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'block')">block</button>
            <button class="btn-cmd btn-unit" onclick="handleCmd('unit', 'blocks')">blocks</button>
        </div>
        <div class="cmd-list" id="cmd-list-b"><div style="color:#aaa; text-align:center; margin-top:10px;">명령어 대기중...</div></div>
        <button class="ready-btn" id="btn-ready-b" onclick="handleReady()">READY</button>
    </div>

</div>

<script type="module">
    // Firebase 설정
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCAR_dSA_jViVY0RZAI3s41a39u9NufFj8",
        authDomain: "where-2599e.firebaseapp.com",
        projectId: "where-2599e",
        storageBucket: "where-2599e.firebasestorage.app",
        messagingSenderId: "1090101095033",
        appId: "1:1090101095033:web:b80a7311d8dff569b842a8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // 필수 글로벌 변수
    const appId = (typeof __app_id !== 'undefined' && __app_id) ? __app_id : 'find-the-place-multi';
    let currentUser = null;
    let myRole = null; // 'A' (Host) or 'B' (Guest)
    let myRoomId = null;
    let roomUnsubscribe = null;
    let myName = "";
    let myAffiliation = "";
    
    // 로컬 상태 (명령어 빌드용)
    let localPending = {}; 
    let localDataCache = null; // Snapshot 저장용

    // 맵 데이터
    const GRID_X = [80, 210, 340, 470]; // 4 columns
    const GRID_Y = [60, 180, 300];      // 3 rows
    const DIRS = [[0,-1], [1,0], [0,1], [-1,0]]; // N, E, S, W
    const ARROWS = ['▲', '▶', '▼', '◀'];

    const PLACES = [
        { id: 'Restaurant', name: 'Restaurant', icon: '🍔', x: 0, y: 0 },
        { id: 'Bus stop', name: 'Bus stop', icon: '🚌', x: 1, y: 0 },
        { id: 'Restroom', name: 'Restroom', icon: '🚻', x: 2, y: 0 },
        { id: 'Park', name: 'Park', icon: '🌳', x: 0, y: 1 },
        { id: 'Hospital', name: 'Hospital', icon: '🏥', x: 1, y: 1 },
        { id: 'Bank', name: 'Bank', icon: '🏦', x: 2, y: 1 },
        { id: 'Library', name: 'Library', icon: '📚', x: 3, y: 1 },
        { id: 'House', name: 'House', icon: '🏠', x: 2, y: 2 },
        { id: 'School', name: 'School', icon: '🏫', x: 3, y: 2 }
    ];

    const QUESTIONS = [
        { target: 'School', sub: 'School(학교)은 어디에 있나요?', a_start: {x:3, y:0, d:2}, b_start: {x:1, y:2, d:1} },
        { target: 'Bank', sub: 'Bank(은행)은 어디에 있나요?', a_start: {x:0, y:1, d:1}, b_start: {x:3, y:1, d:3} },
        { target: 'Park', sub: 'Park(공원)은 어디에 있나요?', a_start: {x:2, y:1, d:3}, b_start: {x:0, y:2, d:0} },
        { target: 'Library', sub: 'Library(도서관)는 어디에 있나요?', a_start: {x:3, y:2, d:0}, b_start: {x:1, y:1, d:1} },
        { target: 'Hospital', sub: 'Hospital(병원)은 어디에 있나요?', a_start: {x:1, y:0, d:2}, b_start: {x:2, y:1, d:3} },
        { target: 'Restaurant', sub: 'Restaurant(식당)은 어디에 있나요?', a_start: {x:2, y:0, d:3}, b_start: {x:0, y:1, d:0} },
        { target: 'House', sub: 'House(집)는 어디에 있나요?', a_start: {x:0, y:2, d:1}, b_start: {x:3, y:2, d:3} },
        { target: 'Restroom', sub: 'Restroom(화장실)은 어디에 있나요?', a_start: {x:2, y:2, d:0}, b_start: {x:3, y:0, d:3} },
        { target: 'Bus stop', sub: 'Bus stop(버스 정류장)은 어디에 있나요?', a_start: {x:0, y:0, d:1}, b_start: {x:1, y:2, d:0} }
    ];

    function sysMsg(msg) { document.getElementById('sys-msg').innerText = msg; }
    function showMsg(msg) { 
        const el = document.getElementById('ingame-msg');
        el.innerText = msg; el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    // 1. 초기화 및 Auth
    drawMap();
    
    const initAuth = async () => {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
            } else {
                await signInAnonymously(auth);
            }
        } catch (e) {
            console.error("Auth Error:", e);
            sysMsg("서버 인증 실패! Firebase 익명 로그인이 활성화되어 있는지 확인하세요.");
        }
    };
    initAuth();

    onAuthStateChanged(auth, user => {
        if(user) {
            currentUser = user;
            if(document.getElementById('sys-msg').innerText.includes("연결 중")) sysMsg("");
        }
    });

    // 1.5. 사용자 정보 입력 (다음 버튼)
    document.getElementById('btn-next-step').onclick = () => {
        const g = document.getElementById('inp-grade').value.trim();
        const c = document.getElementById('inp-class').value.trim();
        const n = document.getElementById('inp-num').value.trim();
        const name = document.getElementById('inp-name').value.trim();

        if(!g || !c || !n || !name) return sysMsg("학년, 반, 번호, 이름을 모두 입력해주세요!");

        myName = name;
        myAffiliation = `${g}학년 ${c}반 ${n}번`;
        
        document.getElementById('welcome-msg').innerText = `환영합니다, ${myName}님!`;
        document.getElementById('lobby-state-0').classList.add('hidden');
        document.getElementById('lobby-state-1').classList.remove('hidden');
        sysMsg(""); // 에러 메시지 초기화
    };

    // 타임아웃 헬퍼 함수
    const fetchWithTimeout = (promise, ms) => {
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("시간 초과")), ms));
        return Promise.race([promise, timeout]);
    };

    // 2. 방 만들기 (Host)
    document.getElementById('btn-create').onclick = async () => {
        if(!currentUser) return sysMsg("서버 연결이 아직 완료되지 않았습니다. 잠시만 기다려주세요.");
        
        try {
            document.getElementById('btn-create').disabled = true;
            sysMsg("방을 생성하는 중입니다...\n(만약 계속 멈춰있다면 Firebase 콘솔에서 Firestore를 생성했는지 확인하세요!)");

            myRole = 'A';
            myRoomId = Math.floor(1000 + Math.random() * 9000).toString();
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
            
            // 8초 이상 걸리면 에러로 간주 (Firestore 미생성 방지)
            await fetchWithTimeout(setDoc(roomRef, {
                state: 'waiting',
                currentQ: 0,
                pA: { name: myName, affiliation: myAffiliation, score: 0, cmds: [], ready: false, pos: {...QUESTIONS[0].a_start} },
                pB: null
            }), 8000);

            document.getElementById('lobby-state-1').classList.add('hidden');
            document.getElementById('lobby-state-2').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = myRoomId;
            
            listenRoom(roomRef);
            sysMsg("");
        } catch (e) {
            console.error("Create Room Error:", e);
            sysMsg(`⚠️ 방 생성 실패\n원인: Firebase 설정 오류 또는 Firestore 미생성\n해결: Firebase 접속 -> 빌드 -> Firestore Database -> 데이터베이스 만들기(테스트 모드) 진행`);
        } finally {
            document.getElementById('btn-create').disabled = false;
        }
    };

    // 3. 방 참여 (Guest)
    document.getElementById('btn-join').onclick = async () => {
        if(!currentUser) return sysMsg("서버 연결이 아직 완료되지 않았습니다. 잠시만 기다려주세요.");
        const code = document.getElementById('inp-room').value.trim();
        if(!code) return sysMsg("참여 코드를 입력하세요!");

        try {
            document.getElementById('btn-join').disabled = true;
            sysMsg("방에 접속하는 중입니다...\n(만약 계속 멈춰있다면 Firebase 설정을 확인하세요!)");

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            
            // 데이터 가져오기 (8초 타임아웃)
            const docSnap = await fetchWithTimeout(getDoc(roomRef), 8000);
            
            if(docSnap.exists()) {
                const data = docSnap.data();
                if(data.pB !== null) {
                    document.getElementById('btn-join').disabled = false;
                    return sysMsg("이미 게임이 진행중인 방입니다.");
                }
                
                myRole = 'B';
                myRoomId = code;
                await updateDoc(roomRef, {
                    pB: { name: myName, affiliation: myAffiliation, score: 0, cmds: [], ready: false, pos: {...QUESTIONS[0].b_start} },
                    state: 'playing'
                });
                sysMsg("");
                listenRoom(roomRef);
            } else {
                sysMsg("입력하신 방 코드를 찾을 수 없습니다.");
            }
        } catch (e) {
            console.error("Join Room Error:", e);
            sysMsg(`⚠️ 접속 실패\n원인: Firebase 설정 오류 또는 Firestore 미생성\n해결: 호스트의 Firebase 환경이 정상인지 확인해주세요.`);
        } finally {
            document.getElementById('btn-join').disabled = false;
        }
    };

    // 4. Firestore 실시간 리스너
    function listenRoom(roomRef) {
        document.getElementById('lobby-overlay').classList.add('hidden');
        document.getElementById('my-role-badge').innerText = myRole === 'A' ? "P1(Host)" : "P2(Guest)";
        document.getElementById('room-code-badge').innerText = myRoomId;
        
        // 상대방 패널 컨트롤 비활성화
        const oppRole = myRole === 'A' ? 'B' : 'A';
        const myPanel = document.getElementById(`panel-${myRole}`);
        const oppPanel = document.getElementById(`panel-${oppRole}`);
        oppPanel.style.opacity = '0.6';
        oppPanel.style.pointerEvents = 'none';

        roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
            if(!snapshot.exists()) return;
            const data = snapshot.data();
            localDataCache = data;
            
            updateUI(data);

            if(data.state === 'animating' && !window.isAnimating) {
                runAnimations(data);
            }
            if(data.state === 'playing' && data.pA.ready && data.pB && data.pB.ready) {
                if(myRole === 'A') {
                    updateDoc(roomRef, { state: 'animating' }).catch(console.error);
                }
            }
        }, (error) => {
            console.error("Snapshot error:", error);
            sysMsg("서버와의 실시간 데이터 통신이 끊어졌습니다.");
        });
    }

    // 5. UI 업데이트
    function updateUI(data) {
        document.getElementById('name-a').innerText = data.pA.name;
        if(data.pB) {
            document.getElementById('name-b').innerText = data.pB.name;
            document.getElementById('marker-b').style.display = 'flex';
        }

        const q = QUESTIONS[data.currentQ];
        if(data.state === 'playing') {
            document.getElementById('question-text').innerText = `Where is the ${q.target}?`;
            document.getElementById('question-sub').innerText = q.sub;
            document.getElementById('ui-q-num').innerText = `Q ${data.currentQ + 1} / 9`;
            
            document.querySelectorAll('.place').forEach(el => el.classList.remove('target'));
            document.getElementById(`place-${q.target}`).classList.add('target');
            
            if(!window.isAnimating) {
                renderMarker('a', data.pA.pos);
                if(data.pB) renderMarker('b', data.pB.pos);
            }
            updateMyButtons(data);
        }

        document.getElementById('ui-score-a').innerText = `P1: ${data.pA.score}/9`;
        document.getElementById('ui-score-b').innerText = `P2: ${data.pB ? data.pB.score : 0}/9`;

        renderCmdList('A', data.pA.cmds);
        if(data.pB) renderCmdList('B', data.pB.cmds);

        document.getElementById('btn-ready-a').classList.toggle('active', data.pA.ready);
        document.getElementById('btn-ready-b').classList.toggle('active', data.pB ? data.pB.ready : false);
    }

    // 버튼 활성/비활성 제어
    function updateMyButtons(data) {
        const myData = data[`p${myRole}`];
        if(!myData) return;

        const isReady = myData.ready;
        const panel = document.getElementById(`panel-${myRole}`);
        
        panel.querySelectorAll('.btn-dir').forEach(b => b.disabled = isReady || localPending.dir);
        panel.querySelectorAll('.btn-num').forEach(b => b.disabled = isReady || !localPending.dir || localPending.num);
        panel.querySelectorAll('.btn-unit').forEach(b => b.disabled = isReady || !localPending.num);
        
        panel.querySelector('.clear-btn').disabled = isReady;
        panel.querySelector('.ready-btn').innerText = isReady ? "WAITING..." : "READY";
    }

    // 6. 사용자 액션 핸들러 (Firestore 업데이트)
    window.handleCmd = async (type, val) => {
        if(localDataCache.state !== 'playing') return;
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
        const myKey = `p${myRole}`;
        const myCmds = localDataCache[myKey].cmds;

        if(type === 'dir') localPending.dir = val;
        else if(type === 'num') localPending.num = val;
        else if(type === 'unit') {
            const str = `${localPending.dir} ${localPending.num} ${val}.`;
            const newCmd = { str: str, action: localPending.dir, dist: localPending.num };
            
            await updateDoc(roomRef, { [`${myKey}.cmds`]: [...myCmds, newCmd] }).catch(console.error);
            localPending = {};
        }
        updateMyButtons(localDataCache);
    };

    window.handleClear = async () => {
        if(localDataCache.state !== 'playing') return;
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
        await updateDoc(roomRef, { [`p${myRole}.cmds`]: [] }).catch(console.error);
        localPending = {};
        updateMyButtons(localDataCache);
    };

    window.handleReady = async () => {
        if(localDataCache.state !== 'playing') return;
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
        const myKey = `p${myRole}`;
        const isReady = localDataCache[myKey].ready;
        await updateDoc(roomRef, { [`${myKey}.ready`]: !isReady }).catch(console.error);
    };

    // 7. 애니메이션 및 채점
    window.isAnimating = false;
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function runAnimations(data) {
        window.isAnimating = true;
        showMsg("애니메이션 진행 중...");
        
        let posA = {...data.pA.pos};
        let posB = {...data.pB.pos};
        
        await Promise.all([
            animatePath('a', posA, data.pA.cmds),
            animatePath('b', posB, data.pB.cmds)
        ]);

        if(myRole === 'A') {
            const targetId = QUESTIONS[data.currentQ].target;
            const tObj = PLACES.find(p => p.id === targetId);
            
            let aScore = data.pA.score;
            let bScore = data.pB.score;
            if(posA.x === tObj.x && posA.y === tObj.y) aScore++;
            if(posB.x === tObj.x && posB.y === tObj.y) bScore++;

            const nextQ = data.currentQ + 1;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomId);
            
            if(nextQ >= 9) {
                await updateDoc(roomRef, {
                    state: 'finished',
                    'pA.score': aScore, 'pB.score': bScore
                }).catch(console.error);
                finishGame(aScore, bScore, data.pA.name, data.pB.name);
            } else {
                await updateDoc(roomRef, {
                    state: 'playing', currentQ: nextQ,
                    'pA.score': aScore, 'pB.score': bScore,
                    'pA.cmds': [], 'pB.cmds': [],
                    'pA.ready': false, 'pB.ready': false,
                    'pA.pos': {...QUESTIONS[nextQ].a_start},
                    'pB.pos': {...QUESTIONS[nextQ].b_start}
                }).catch(console.error);
            }
        }
        window.isAnimating = false;
    }

    async function animatePath(markerId, pos, cmds) {
        for(let cmd of cmds) {
            if(cmd.action === 'Turn left') pos.d = (pos.d + 3) % 4;
            else if(cmd.action === 'Turn right') pos.d = (pos.d + 1) % 4;
            
            renderMarker(markerId, pos);
            await delay(300);
            
            for(let i=0; i<cmd.dist; i++) {
                let nx = pos.x + DIRS[pos.d][0];
                let ny = pos.y + DIRS[pos.d][1];
                if(nx >= 0 && nx < 4 && ny >= 0 && ny < 3) {
                    pos.x = nx; pos.y = ny;
                    renderMarker(markerId, pos);
                    await delay(600);
                }
            }
        }
    }

    // 8. 그리기 유틸
    function drawMap() {
        const map = document.getElementById('map');
        GRID_Y.forEach(y => map.innerHTML += `<div class="road-h" style="top:${y-20}px;"></div><div class="dash-h" style="top:${y-1}px;"></div>`);
        GRID_X.forEach(x => map.innerHTML += `<div class="road-v" style="left:${x-20}px;"></div><div class="dash-v" style="left:${x-1}px;"></div>`);
        PLACES.forEach(p => {
            map.innerHTML += `<div class="place" id="place-${p.id}" style="left:${GRID_X[p.x]}px; top:${GRID_Y[p.y]}px;"><div class="emoji">${p.icon}</div><div class="name">${p.name}</div></div>`;
        });
        map.appendChild(document.getElementById('marker-a'));
        map.appendChild(document.getElementById('marker-b'));
    }

    function renderMarker(id, pos) {
        const el = document.getElementById(`marker-${id}`);
        el.style.left = `${GRID_X[pos.x]}px`;
        el.style.top = `${GRID_Y[pos.y]}px`;
        el.querySelector('.dir-arrow').innerText = ARROWS[pos.d];
    }

    function renderCmdList(role, cmds) {
        const list = document.getElementById(`cmd-list-${role.toLowerCase()}`);
        if(!cmds || cmds.length === 0) list.innerHTML = `<div style="color:#aaa; text-align:center; margin-top:10px;">명령어 대기중...</div>`;
        else list.innerHTML = cmds.map(c => `<div class="cmd-item">${c.str}</div>`).join('');
        list.scrollTop = list.scrollHeight;
    }

    window.speakQuestion = () => {
        const text = document.getElementById('question-text').innerText;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; speechSynthesis.speak(u);
    };

    // 9. 게임 종료 및 랭킹
    async function finishGame(scoreA, scoreB, nameA, nameB) {
        document.getElementById('result-overlay').classList.remove('hidden');
        if(roomUnsubscribe) roomUnsubscribe();
        
        let winMsg = scoreA > scoreB ? `${nameA} 승리! 🎉` : (scoreB > scoreA ? `${nameB} 승리! 🎉` : "무승부! 🤝");
        document.getElementById('result-msg').innerText = winMsg;

        try {
            const hofRef = collection(db, 'artifacts', appId, 'public', 'data', 'hallOfFame');
            if(myRole === 'A') {
                await addDoc(hofRef, { name: nameA, affiliation: localDataCache.pA.affiliation, score: scoreA, ts: Date.now() });
                await addDoc(hofRef, { name: nameB, affiliation: localDataCache.pB.affiliation, score: scoreB, ts: Date.now() });
            }
            
            setTimeout(async () => {
                const snap = await getDocs(hofRef);
                let records = [];
                snap.forEach(doc => records.push(doc.data()));
                records.sort((a,b) => b.score - a.score);
                records = records.slice(0, 10);
                
                document.getElementById('leaderboard-body').innerHTML = records.map((r, i) => `
                    <tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':''}${i+1}위</td>
                    <td>${r.affiliation}</td>
                    <td><b>${r.name}</b></td><td style="color:#d81b60; font-weight:bold;">${r.score}점</td></tr>
                `).join('');
            }, 1000);

        } catch (e) {
            console.error("Hall of Fame Error:", e);
            document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" style="color:red;">랭킹 로딩 실패</td></tr>`;
        }
    }
</script>
</body>
</html>
